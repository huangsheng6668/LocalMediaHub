# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=Windows-ROOT -Djavax.net.ssl.trustStore=NONE
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# The Kotlin compile daemon repeatedly crashes on this machine with
# "Daemon compilation failed: null"; running the compiler inside the Gradle
# daemon process sidesteps the flaky out-of-process daemon.
kotlin.compiler.execution.strategy=in-process

systemProp.http.ssl.insecure=true
systemProp.http.ssl.allowall=true
systemProp.http.ssl.ignore.validity.dates=true

