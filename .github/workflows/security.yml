name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same ref when new commits are pushed.
# Saves CI minutes when developers push multiple commits in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-vuln:
    name: Go vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ayatana-appindicator (Linux GUI dep)
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: server
        run: govulncheck ./...

  cargo-audit:
    name: Rust cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        working-directory: android/app/src/main/rust
        run: cargo audit

  xsscheck:
    name: XSS lint (Web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run xsscheck tests
        working-directory: tools/xsscheck
        run: go test ./...
      - name: Run xsscheck on real Web UI
        working-directory: tools/xsscheck
        run: go run .

  go-test:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ayatana-appindicator (Linux GUI dep)
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run server tests
        working-directory: server
        run: go test ./...

  gradle-test:
    name: Android build + tests + SHA256 verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew
      - name: Run Android unit tests + debug build
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
