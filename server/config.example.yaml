server:
  host: "0.0.0.0"
  port: 8000
  # Bearer token：留空 = 开放模式（同网段任何人可访问全部 API，仅删除接口受限）。
  # 强烈建议家用共享 Wi-Fi 下设置长随机串，例如：
  #   python -c "import secrets; print(secrets.token_urlsafe(32))"
  # token 为空且 ble.token 也为空时 BLE 走开放模式（2026-08-30）：跳过握手、
  # v1 无认证帧，半径内任何设备可交换数据，启动时打 WARN；想启用 BLE 认证
  # 请配置下方 ble.token。
  token: ""

  # 零接触配对（默认关闭）：开启后局域网内任何设备可经 POST /api/v1/pair
  # 免认证获取一次 token（含 ble.token，如已配置），App 在局域网内即可全自动
  # 完成 HTTP 认证与 BLE 握手的密钥配置，无需手动抄 token。这是有意向局域网
  # 开放 token 的便利开关——仅在首次配对期间打开，手机连上后请改回 false。
  lan_pairing: false

ble:
  # Dedicated BLE handshake key. Empty = OPEN mode (2026-08-30): the BLE
  # channel runs without a handshake on unauthenticated v1 frames — anyone
  # in range can exchange data. Set a key to require HMAC authentication.
  # Fallback when empty but server.token is set: server.token.
  token: ""


scan:
  # Media roots. If empty AND system.allowed_roots is empty AND auto_detect_roots
  # is false, the server REFUSES TO START (Phase 3 safety default).
  # Explicit roots are strongly recommended for production.
  roots: []
    # - "D:/Movies"
    # - "E:/Photos"
  video_extensions:
    - ".mp4"
    - ".mkv"
    - ".avi"
    - ".mov"
    - ".wmv"
    - ".flv"
    - ".ts"
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".bmp"
    - ".webp"
  text_extensions:
    - ".txt"
    - ".epub"
    - ".mobi"
    - ".azw3"
  # OPT-IN auto-detection: when true, server scans all detected drives (A-Z).
  # Convenience feature with elevated risk — any LAN host (or any authenticated
  # client) can browse media on ALL drives. Default false.
  auto_detect_roots: false

thumbnail:
  cache_dir: ".cache/thumbnails"
  max_size: 300
  format: "JPEG"

# System browse: restrict which directories are visible to the Android client.
# If omitted or empty, /api/v1/system/* browsing is disabled.
system:
  # CAUTION: when true, AUTHENTICATED clients can delete files under
  # allowed_roots via POST /api/v1/system/delete. Defaults to false.
  # Delete additionally REQUIRES a non-empty server.token — without one the
  # endpoint always returns 403, so remote deletion can never run unauthenticated.
  enable_delete: false
  allowed_roots: []
    # - "D:/Media"

# Transcode path (spec 2026-09-03-transcode-modernization). The hardware
# encoder probe runs lazily on the first transcode request. An encoder is
# used only after BOTH a static check (listed by "ffmpeg -encoders") AND a
# runtime testsrc micro-encode succeed — listed-but-driver-broken encoders
# are skipped with a WARN. libx264 (ultrafast) is always the final fallback
# and never needs to be listed here.
transcode:
  encoder_preference:
    - "h264_nvenc"
    - "h264_qsv"
    - "h264_amf"
  # Concurrent transcode session cap (requests beyond the cap queue silently;
  # queued requests are dropped if the client disconnects while waiting).
  # 0 / absent = 3. -1 = unlimited.
  max_sessions: 3

# Debug features. All off by default; opt in explicitly only when needed.
# Round 32 S3: pprof was previously registered unconditionally — now requires
# debug.pprof=true here OR the --debug-pprof CLI flag (flag overrides config).
# Even when enabled, /debug/pprof/* is gated by the PrivateNetOnly middleware
# (loopback / RFC1918 LAN IPs only) as defense-in-depth.
debug:
  pprof: false
