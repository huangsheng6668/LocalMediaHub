server:
  host: "0.0.0.0"
  port: 8000
  # Auth token for admin/system/media API endpoints.
  # Empty (default) = open mode (any LAN host can access — for trusted home networks only).
  # Set to a long random string to require `Authorization: Bearer <token>` on protected routes.
  # Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  token: ""

scan:
  video_extensions:
    - ".mp4"
    - ".mkv"
    - ".avi"
    - ".mov"
    - ".wmv"
    - ".flv"
    - ".ts"
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".bmp"
    - ".webp"

thumbnail:
  cache_dir: ".cache/thumbnails"
  max_size: 300
  format: "JPEG"

# System browse: restrict which directories are visible to the Android client.
# If omitted or empty, /api/v1/system/* browsing is disabled.
system:
  allowed_roots:
    - "/usr/media/path"
